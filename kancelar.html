<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#23201b">
<meta name="robots" content="noindex, nofollow">
<title>Vixen – kancelář</title>
<link rel="stylesheet" href="styles.css">
<style>
main{max-width:760px}
.tik{display:flex;justify-content:space-between;gap:10px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:8px 0;background:#fff;cursor:pointer}
.tik small{display:block;color:var(--mute)}
.zpr{border-left:3px solid var(--line);padding:6px 10px;margin:8px 0;background:#fff;border-radius:0 8px 8px 0}
.zpr.tbdb{border-left-color:var(--gold)}
.zpr small{color:var(--mute)}
.typy label{font-size:14px}
.pozn{font-size:12.5px;color:var(--mute)}
.dikt{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:6px}
.mic{border:1px solid var(--gold);background:#fff;color:var(--gold-d);border-radius:20px;padding:7px 14px;font:inherit;font-size:14px;cursor:pointer}
.mic.nahrava{background:var(--bad);border-color:var(--bad);color:#fff;animation:puls 1.2s infinite}
@keyframes puls{50%{opacity:.7}}
.knav{display:flex;gap:6px;margin:0 0 14px;border-bottom:1px solid var(--line)}
.knav button{border:0;background:none;font:inherit;font-weight:600;padding:10px 12px;color:var(--mute);border-bottom:3px solid transparent;cursor:pointer}
.knav button.on{color:var(--ink);border-bottom-color:var(--gold)}
.pocet{display:inline-block;min-width:20px;padding:0 6px;border-radius:10px;background:var(--bad);color:#fff;font-size:12px;text-align:center}
.prihl-hl{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:17px}
.prihl dl{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:10px 0;font-size:14.5px}
.prihl dt{color:var(--mute)}.prihl dd{margin:0}
.akce{display:flex;gap:8px;flex-wrap:wrap}.akce .btn{width:auto;flex:1 1 140px}
.no{color:var(--bad);font-weight:600}
.filtr{margin-bottom:6px}
</style>
</head>
<body>
<div class="top"><b>VIXEN · KANCELÁŘ</b><span id="kdo" style="color:#ccc;font-size:13px"></span><button id="odhlasit" class="hidden">Odhlásit</button></div>
<div class="env" id="env"></div>
<main id="app"><p class="mute">Načítám…</p></main>
<script src="supabase.js"></script>
<script src="config.js"></script>
<script src="kontroly.js"></script>
<script src="kancelar.js"></script>
</body>
</html>
